name: test-assistent-mcp-server
displayName: Test Assistant MCP Server
description: MCP server for OpenCode that exposes classic test techniques and test heuristics as tools. Supports BVA, equivalence partitioning, pairwise testing, decision tables, state transitions, use cases, and error guessing — plus heuristics like SFDPOT, FEW HICCUPPS, RCRCRC.
version: "0.1.0"
author: Cerios TechLab
homepage: https://github.com/Cerios-TechLab/test-assistent-mcp-server
license: MIT
categories:
  - testing
  - quality-assurance
tags:
  - testing
  - test-automation
  - mcp
  - opencode
runtime: python
startCommand:
  type: stdio
  command:
    - python
    - -m
    - server.testassist_mcp_server
  env: {}
configSchema:
  type: object
  additionalProperties: true
  properties: {}
