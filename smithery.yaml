name: test-assistent-mcp-server
displayName: Test Assistant MCP Server
description: MCP server for OpenCode that exposes classic test techniques (7), test heuristics, and test data generation (random rows, property-based) as 6 tools. Supports BVA, equivalence partitioning, pairwise testing, decision tables, state transitions, use cases, error guessing, SFDPOT, FEW HICCUPPS, RCRCRC, and more.
version: "1.1.0"
author: Cerios TechLab
homepage: https://github.com/Cerios-TechLab/test-assistent-mcp-server
license: MIT
categories:
  - testing
  - quality-assurance
tags:
  - testing
  - test-automation
  - mcp
  - opencode
  - property-based-testing
runtime: python
startCommand:
  type: stdio
  command:
    - python
    - -m
    - server.testassist_mcp_server
  env: {}
configSchema:
  type: object
  additionalProperties: true
  properties: {}
