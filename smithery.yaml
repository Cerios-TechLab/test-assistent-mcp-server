name: test-assistent-mcp-server
displayName: Test Assistant MCP Server
description: MCP server for OpenCode that exposes classic test techniques (BVA, EP, pairwise, decision table, state transition, use case, error guessing) and test heuristics (SFDPOT, FEW HICCUPPS, RCRCRC, quality criteria, bug heuristics, test tours) as tools. Generates concrete testcases, advises on technique selection, and produces checklists.
version: "0.1.0"
author: Cerios TechLab
homepage: https://github.com/Cerios-TechLab/test-assistent-mcp-server
license: MIT
categories:
  - testing
  - quality-assurance
tags:
  - testing
  - test-automation
  - mcp
  - opencode
runtime: python
startCommand:
  type: stdio
  command:
    - python
    - -m
    - server.testassist_mcp_server
  env: {}
